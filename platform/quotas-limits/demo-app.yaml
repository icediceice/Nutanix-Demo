apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: demo-app
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 384Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-app-quota
  namespace: demo-app
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 8Gi
    limits.cpu: "40"
    limits.memory: 28Gi
    pods: "40"