kind: HelmRelease
metadata:
  name: gatekeeper
  namespace: flux-system
spec:
  interval: 5m0s
  targetNamespace: gatekeeper-system
  install:
    createNamespace: true
  chart:
    spec:
      chart: gatekeeper
      version: "3.*"
      sourceRef:
        kind: HelmRepository
