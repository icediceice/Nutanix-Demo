apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-app
resources:
  - services.yaml
configMapGenerator:
  - name: otel-shop-config
    literals:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger-jaeger-operator-jaeger-collector.istio-system.svc.cluster.local:4317
      - OTEL_SERVICE_NAMESPACE=demo-app
