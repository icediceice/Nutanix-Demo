apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-v2
spec:
  replicas: 1
  # Avoid temporary rollout surge that can exceed ResourceQuota during restarts/rollouts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
      version: v2
  template:
    metadata:
      labels:
        app: frontend
        version: v2
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/icediceice/otel-shop-lite-frontend:v2-story-20260216b # {"$imagepolicy": "flux-system:otel-shop-frontend-policy"}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: frontend
            - name: SERVICE_VERSION
              value: v2
            - name: CATALOG_URL
              value: http://catalog-api.demo-app.svc.cluster.local
            - name: CHECKOUT_URL
              value: http://checkout-api.demo-app.svc.cluster.local
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: otel-shop-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: otel-shop-config
                  key: OTEL_SERVICE_NAMESPACE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
---
