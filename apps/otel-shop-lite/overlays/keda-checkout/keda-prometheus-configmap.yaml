apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-prometheus
  namespace: demo-app
data:
  # Prometheus lives in the NKP workspace namespace, which varies per cluster.
  # Run bootstrap-demo.sh --discover-prometheus to auto-detect and patch this value.
  # Fallback: discover-prometheus.sh will scan the cluster for any Prometheus service on port 9090.
  serverAddress: http://kube-prometheus-stack-prometheus.kommander.svc.cluster.local:9090
