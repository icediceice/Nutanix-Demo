apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ops-loadgen
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./ops
  prune: true
  sourceRef:
    kind: GitRepository
    name: nkp-rx-demo
  dependsOn:
    - name: apps
    - name: mesh
  wait: true
  timeout: 2m0s