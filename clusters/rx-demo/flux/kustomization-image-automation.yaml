apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  suspend: true
  interval: 1m0s
  path: ./clusters/rx-demo/image-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: nkp-rx-demo
  dependsOn:
    - name: apps
  wait: true
  timeout: 2m0s
