apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rx-demo
  namespace: argocd
spec:
  project: rx-demo
  source:
    repoURL: https://github.com/icediceice/Nutanix-Demo.git
    targetRevision: scenario/load-off
    path: clusters/rx-demo/argocd/root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      # Allows first-sync on clusters where CRDs are installed asynchronously (e.g., Gatekeeper templates creating constraint CRDs).
      - SkipDryRunOnMissingResource=true
      # Prevent ArgoCD from overwriting fields listed in ignoreDifferences during sync.
      # Required so the PostSync discover-prometheus Job's patches to ConfigMap and ScaledObject survive subsequent syncs.
      - RespectIgnoreDifferences=true
  # Allow cluster-specific Prometheus endpoints for the KEDA demo without forcing repo edits.
  # The PostSync discover-prometheus Job auto-detects the endpoint and patches both resources.
  # RespectIgnoreDifferences=true ensures those patches are not reverted on subsequent syncs.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: keda-prometheus
      namespace: demo-app
      jsonPointers:
        - /data/serverAddress
    - group: keda.sh
      kind: ScaledObject
      name: checkout-api-v1-keda
      namespace: demo-app
      jsonPointers:
        - /spec/triggers/0/metadata/serverAddress
