apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-wall
  namespace: demo-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-wall
  template:
    metadata:
      labels:
        app: demo-wall
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: demo-wall
      containers:
        - name: demo-wall
          image: ghcr.io/icediceice/otel-shop-lite-frontend:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/server.py", "--port", "8080"]
          env:
            - name: KOMMANDER_SSO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: demo-wall-access
                  key: kommander_username
                  optional: true
            - name: KOMMANDER_SSO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-wall-access
                  key: kommander_password
                  optional: true
            - name: ARGOCD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: demo-wall-access
                  key: argocd_username
                  optional: true
            - name: ARGOCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-wall-access
                  key: argocd_password
                  optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            timeoutSeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: demo-wall
