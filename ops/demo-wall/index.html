<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NKP Demo Wall</title>
  <style>
    :root {
      --bg-a: #08101a;
      --bg-b: #11243a;
      --card: #101b2b;
      --line: #2d4564;
      --ink: #e8f0ff;
      --muted: #9db3cf;
      --good: #2ed5a7;
      --bad: #ff6b6b;
      --warn: #ffca57;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, var(--bg-b), var(--bg-a) 60%);
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title { margin: 0; font-size: clamp(1.3rem, 2.5vw, 2rem); }
    .stamp { color: var(--muted); font-size: .95rem; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .card {
      background: rgba(16, 27, 43, .92);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .label {
      color: var(--muted);
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .value {
      margin-top: 6px;
      font-size: 1.06rem;
      font-weight: 700;
      word-break: break-word;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: .86rem;
      word-break: break-word;
    }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .link-card { display: flex; flex-direction: column; gap: 8px; }
    .link-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid var(--line);
      padding: 5px 10px;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    a.link {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dotted #4e81b9;
      word-break: break-all;
    }
    .hint {
      color: var(--muted);
      font-size: .86rem;
      line-height: 1.35;
    }
    .cmd {
      margin: 0;
      font-size: .8rem;
      color: #bfd2ec;
      background: #0a1522;
      border: 1px solid #23374f;
      border-radius: 8px;
      padding: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .error {
      margin-top: 8px;
      color: var(--bad);
      white-space: pre-wrap;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1 class="title">NKP Demo Wall</h1>
      <div class="stamp">Auto-refresh: 5s | Last update: <span id="updatedAt">-</span></div>
    </div>

    <section class="cards">
      <article class="card">
        <div class="label">Scenario</div>
        <div id="scenario" class="value">-</div>
        <div id="revision" class="sub">-</div>
      </article>
      <article class="card">
        <div class="label">CD Status</div>
        <div id="cdStatus" class="value">-</div>
      </article>
      <article class="card">
        <div class="label">Traffic</div>
        <div id="traffic" class="value">-</div>
        <div id="loadgen" class="sub">-</div>
      </article>
      <article class="card">
        <div class="label">Policy</div>
        <div id="policy" class="value">-</div>
      </article>
    </section>

    <section class="kpi-grid" id="kpiCards"></section>

    <section class="card">
      <div class="label">Quick Links</div>
      <div id="linksGrid" class="links-grid" style="margin-top:10px"></div>
    </section>

    <div id="error" class="error"></div>
  </div>

  <script>
    function statusClass(v) {
      if (v === "good" || v === "Healthy" || v === "Synced" || v === "ready") return "good";
      if (v === "bad" || v === "Degraded" || v === "Missing") return "bad";
      return "warn";
    }

    function safe(v) {
      return (v === undefined || v === null || v === "") ? "-" : String(v);
    }

    function setText(id, value, klass) {
      const el = document.getElementById(id);
      el.textContent = safe(value);
      el.className = (id === "revision" || id === "loadgen") ? "sub " + (klass || "") : "value " + (klass || "");
    }

    function shortSha(v) {
      const s = safe(v);
      if (s === "-") return s;
      return s.length > 12 ? s.slice(0, 12) : s;
    }

    function renderKpis(items) {
      const kpiCards = document.getElementById("kpiCards");
      kpiCards.innerHTML = "";
      (items || []).forEach(k => {
        const card = document.createElement("article");
        card.className = "card";
        const cls = statusClass(k.status);
        card.innerHTML = `
          <div class="label">${safe(k.name)}</div>
          <div class="value ${cls}">${safe(k.value)}</div>
          <div class="sub">Target: ${safe(k.threshold)}</div>
        `;
        kpiCards.appendChild(card);
      });
    }

    function renderLinks(items) {
      const grid = document.getElementById("linksGrid");
      grid.innerHTML = "";
      (items || []).forEach(link => {
        const card = document.createElement("article");
        card.className = "card link-card";

        const title = document.createElement("div");
        title.className = "label";
        title.textContent = safe(link.name);
        card.appendChild(title);

        const row = document.createElement("div");
        row.className = "link-row";

        const badge = document.createElement("span");
        badge.className = "pill " + statusClass(link.status);
        badge.textContent = safe(link.status);
        row.appendChild(badge);

        if (link.url) {
          const a = document.createElement("a");
          a.className = "link";
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noreferrer";
          a.textContent = link.url;
          row.appendChild(a);
        }

        card.appendChild(row);

        if (link.hint) {
          const hint = document.createElement("div");
          hint.className = "hint";
          hint.textContent = link.hint;
          card.appendChild(hint);
        }

        if (link.command) {
          const cmd = document.createElement("pre");
          cmd.className = "cmd";
          cmd.textContent = link.command;
          card.appendChild(cmd);
        }

        grid.appendChild(card);
      });
    }

    function render(data) {
      document.getElementById("updatedAt").textContent = new Date(data.now).toLocaleTimeString();

      const cd = data.cd || {};
      setText("scenario", cd.branch, "");
      setText("revision", `Revision: ${shortSha(cd.revision)}`, "");

      const cdStatus = `${safe(cd.sync)} / ${safe(cd.health)}`;
      setText("cdStatus", cdStatus, statusClass(cd.health));

      const canary = data.canary || {};
      setText("traffic", `v1/v2 = ${safe(canary.v1)}/${safe(canary.v2)}`, "");

      const lg = data.loadgen || {};
      setText("loadgen", `Loadgen: ${safe(lg.desiredReplicas)}/${safe(lg.readyReplicas)} (${safe(lg.profile)})`, "");

      const policy = data.policy || {};
      setText("policy", `${safe(policy.compliance)}% (${safe(policy.status)})`, statusClass(policy.status));

      renderKpis(data.kpi || []);
      renderLinks(data.links || []);

      document.getElementById("error").textContent = "";
    }

    async function tick() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error(`status ${res.status}`);
        render(await res.json());
      } catch (err) {
        document.getElementById("error").textContent = "Status fetch failed: " + err;
      }
    }

    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
