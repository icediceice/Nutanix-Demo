<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NKP Demo Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Nutanix brand */
      --nx-blue:    #0091DA;
      --nx-green:   #AFD135;
      --nx-navy:    #003B5C;
      /* Wall tokens */
      --bg-a:  #001020;
      --bg-b:  #001828;
      --card:  #002238;
      --line:  #004068;
      --ink:   #D8E8F8;
      --muted: #6090B8;
      --good:  #AFD135;
      --bad:   #FF5252;
      --warn:  #F5A623;
      --accent: #0091DA;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Work Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(ellipse at 20% 0%, #002840 0%, var(--bg-a) 55%);
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

    /* ── Header ── */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--nx-green);
      color: var(--nx-navy);
      font-family: "Sora", sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .title {
      margin: 0;
      font-family: "Sora", "Work Sans", sans-serif;
      font-size: clamp(1.2rem, 2.5vw, 1.75rem);
      font-weight: 700;
    }
    .stamp { color: var(--muted); font-size: .86rem; }

    /* ── Section labels ── */
    .section-label {
      margin: 0 0 8px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: rgba(16, 27, 43, .92);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .label {
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    .value {
      margin-top: 6px;
      font-family: "Sora", "Work Sans", sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      word-break: break-word;
    }
    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: .83rem;
      word-break: break-word;
    }
    .intent {
      margin-top: 6px;
      font-size: .78rem;
      line-height: 1.45;
      color: var(--muted);
      font-style: italic;
      word-break: break-word;
    }
    .next-hint {
      margin-top: 7px;
      font-size: .7rem;
      color: var(--muted);
      opacity: .75;
    }
    .next-hint strong { color: var(--accent); font-style: normal; font-weight: 600; }
    .keda-bar-wrap {
      margin-top: 10px;
      height: 5px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
    }
    .keda-bar {
      height: 100%;
      border-radius: 3px;
      background: var(--nx-green);
      transition: width 1.2s ease;
      width: 0%;
    }
    .quota-bar-wrap {
      margin-top: 10px;
      height: 5px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
    }
    .quota-bar {
      height: 100%;
      border-radius: 3px;
      transition: width 1.2s ease, background 1.2s ease;
      width: 0%;
    }
    .good { color: var(--good); }
    .bad  { color: var(--bad); }
    .warn { color: var(--warn); }

    /* ── KPI grid ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    /* ── Platform access ── */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }
    .link-card { display: flex; flex-direction: column; gap: 8px; }
    .link-row  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid var(--line);
      padding: 3px 10px;
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    a.link {
      color: var(--nx-blue);
      text-decoration: none;
      border-bottom: 1px dotted rgba(0,145,218,.5);
      word-break: break-all;
    }
    .hint {
      color: var(--muted);
      font-size: .83rem;
      line-height: 1.4;
    }
    .cmd {
      margin: 0;
      font-size: .76rem;
      color: #bfd2ec;
      background: #0a1522;
      border: 1px solid #23374f;
      border-radius: 8px;
      padding: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* ── Error & footer ── */
    .error {
      margin-top: 8px;
      color: var(--bad);
      white-space: pre-wrap;
      font-size: .88rem;
    }
    footer {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: .76rem;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="top">
      <div class="brand">
        <span class="brand-mark">NX</span>
        <h1 class="title">NKP Demo Wall</h1>
      </div>
      <div class="stamp">Auto-refresh 5s &nbsp;&middot;&nbsp; Last update: <span id="updatedAt">-</span></div>
    </div>

    <p class="section-label">Live Status</p>
    <section class="cards">
      <article class="card">
        <div class="label">Scenario</div>
        <div id="scenario" class="value">-</div>
        <div id="revision" class="sub">-</div>
        <div id="intent" class="intent"></div>
        <div id="nextScenario" class="next-hint"></div>
      </article>
      <article class="card">
        <div class="label">CD Status</div>
        <div id="cdStatus" class="value">-</div>
      </article>
      <article class="card">
        <div class="label">Traffic</div>
        <div id="traffic" class="value">-</div>
        <div id="loadgen" class="sub">-</div>
      </article>
      <article class="card">
        <div class="label">Policy</div>
        <div id="policy" class="value">-</div>
      </article>
      <article class="card" id="quotaCard" style="display:none">
        <div class="label">Namespace Quota</div>
        <div id="quotaStatus" class="value">-</div>
        <div id="quotaDetail" class="sub">-</div>
        <div class="quota-bar-wrap"><div id="quotaBar" class="quota-bar"></div></div>
      </article>
      <article class="card" id="kedaCard" style="display:none">
        <div class="label">Autoscaler (KEDA)</div>
        <div id="kedaStatus" class="value">-</div>
        <div id="kedaReplicas" class="sub">-</div>
        <div class="keda-bar-wrap"><div id="kedaBar" class="keda-bar"></div></div>
      </article>
    </section>

    <p class="section-label">KPIs</p>
    <section class="kpi-grid" id="kpiCards"></section>

    <p class="section-label">Platform Access</p>
    <section class="card">
      <div id="linksGrid" class="links-grid"></div>
    </section>

    <div id="error" class="error"></div>

    <footer>
      <span>NKP Rx GitOps Demo</span>
      <span>Nutanix</span>
    </footer>
  </div>

  <script>
    function statusClass(v) {
      if (v === "good" || v === "Healthy" || v === "Synced" || v === "ready") return "good";
      if (v === "bad" || v === "Degraded" || v === "Missing") return "bad";
      return "warn";
    }

    function safe(v) {
      return (v === undefined || v === null || v === "") ? "-" : String(v);
    }

    function setText(id, value, klass) {
      const el = document.getElementById(id);
      el.textContent = safe(value);
      el.className = (id === "revision" || id === "loadgen") ? "sub " + (klass || "") : "value " + (klass || "");
    }

    function shortSha(v) {
      const s = safe(v);
      if (s === "-") return s;
      return s.length > 12 ? s.slice(0, 12) : s;
    }

    function renderKpis(items) {
      const kpiCards = document.getElementById("kpiCards");
      kpiCards.innerHTML = "";
      (items || []).forEach(k => {
        const card = document.createElement("article");
        card.className = "card";
        const cls = statusClass(k.status);
        card.innerHTML = `
          <div class="label">${safe(k.name)}</div>
          <div class="value ${cls}">${safe(k.value)}</div>
          <div class="sub">Target: ${safe(k.threshold)}</div>
        `;
        kpiCards.appendChild(card);
      });
    }

    function renderLinks(items) {
      const grid = document.getElementById("linksGrid");
      grid.innerHTML = "";
      (items || []).forEach(link => {
        const card = document.createElement("article");
        card.className = "card link-card";

        const title = document.createElement("div");
        title.className = "label";
        title.textContent = safe(link.name);
        card.appendChild(title);

        const row = document.createElement("div");
        row.className = "link-row";

        const badge = document.createElement("span");
        badge.className = "pill " + statusClass(link.status);
        badge.textContent = safe(link.status);
        row.appendChild(badge);

        if (link.url) {
          const a = document.createElement("a");
          a.className = "link";
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noreferrer";
          a.textContent = link.url;
          row.appendChild(a);
        }

        card.appendChild(row);

        if (link.hint) {
          const hint = document.createElement("div");
          hint.className = "hint";
          hint.textContent = link.hint;
          card.appendChild(hint);
        }

        if (link.username) {
          const user = document.createElement("div");
          user.className = "hint";
          user.textContent = `Username: ${link.username}`;
          card.appendChild(user);
        }

        if (link.password) {
          const pass = document.createElement("pre");
          pass.className = "cmd";
          pass.textContent = `Password: ${link.password}`;
          card.appendChild(pass);
        }

        if (link.command) {
          const cmd = document.createElement("pre");
          cmd.className = "cmd";
          cmd.textContent = link.command;
          card.appendChild(cmd);
        }

        grid.appendChild(card);
      });
    }

    function render(data) {
      document.getElementById("updatedAt").textContent = new Date(data.now).toLocaleTimeString();

      const cd = data.cd || {};
      setText("scenario", cd.branch, "");
      setText("revision", `Revision: ${shortSha(cd.revision)}`, "");

      const intentEl = document.getElementById("intent");
      if (intentEl) intentEl.textContent = cd.intent || "";

      const nextEl = document.getElementById("nextScenario");
      if (nextEl) {
        nextEl.innerHTML = cd.next
          ? `Next \u2192 <strong>${cd.next}</strong>`
          : "";
      }

      const cdStatus = `${safe(cd.sync)} / ${safe(cd.health)}`;
      setText("cdStatus", cdStatus, statusClass(cd.health));

      const canary = data.canary || {};
      setText("traffic", `v1 / v2 = ${safe(canary.v1)} / ${safe(canary.v2)}`, "");

      const lg = data.loadgen || {};
      setText("loadgen", `Loadgen: ${safe(lg.desiredReplicas)}/${safe(lg.readyReplicas)} (${safe(lg.profile)})`, "");

      const policy = data.policy || {};
      setText("policy", `${safe(policy.compliance)}% (${safe(policy.status)})`, statusClass(policy.status));

      const quota = data.quota || {};
      const quotaCard = document.getElementById("quotaCard");
      if (quotaCard) {
        if (quota.available) {
          quotaCard.style.display = "";
          const p = quota.pods || {};
          const quotaStatusEl = document.getElementById("quotaStatus");
          if (quotaStatusEl) {
            quotaStatusEl.textContent = `${p.used} / ${p.hard} pods  (${p.pct}%)`;
            quotaStatusEl.className = "value " + (p.status === "good" ? "good" : p.status === "warn" ? "warn" : "bad");
          }
          const quotaDetailEl = document.getElementById("quotaDetail");
          if (quotaDetailEl) {
            const cpu = quota.cpu || {};
            const mem = quota.mem || {};
            quotaDetailEl.textContent = `CPU req: ${cpu.used} / ${cpu.hard} cores  \u00b7  Mem req: ${mem.used} / ${mem.hard} Mi`;
          }
          const quotaBar = document.getElementById("quotaBar");
          if (quotaBar) {
            quotaBar.style.width = p.pct + "%";
            quotaBar.style.background = p.status === "good"
              ? "var(--good)" : p.status === "warn"
              ? "var(--warn)" : "var(--bad)";
          }
        } else {
          quotaCard.style.display = "none";
        }
      }

      const keda = data.keda || {};
      const kedaCard = document.getElementById("kedaCard");
      if (kedaCard) {
        if (keda.enabled) {
          kedaCard.style.display = "";
          const kedaStatusEl = document.getElementById("kedaStatus");
          if (kedaStatusEl) {
            kedaStatusEl.textContent = keda.active ? "Active \u2191 scaling" : "Idle \u00b7 scaled to zero";
            kedaStatusEl.className = "value " + (keda.active ? "good" : "warn");
          }
          const kedaReplicasEl = document.getElementById("kedaReplicas");
          if (kedaReplicasEl) {
            kedaReplicasEl.textContent = `checkout-api-v1: ${keda.currentReplicas} ready  \u00b7  range: ${keda.minReplicas}\u2013${keda.maxReplicas}`;
          }
          const kedaBar = document.getElementById("kedaBar");
          if (kedaBar) {
            const pct = keda.maxReplicas > 0
              ? Math.round((keda.currentReplicas / keda.maxReplicas) * 100)
              : 0;
            kedaBar.style.width = pct + "%";
          }
        } else {
          kedaCard.style.display = "none";
        }
      }

      renderKpis(data.kpi || []);
      renderLinks(data.links || []);

      document.getElementById("error").textContent = "";
    }

    async function tick() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error(`status ${res.status}`);
        render(await res.json());
      } catch (err) {
        document.getElementById("error").textContent = "Status fetch failed: " + err;
      }
    }

    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
