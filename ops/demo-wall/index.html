<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NKP Demo Wall</title>
  <style>
    :root {
      --bg-a: #08101a;
      --bg-b: #11243a;
      --card: #101b2b;
      --line: #2d4564;
      --ink: #e8f0ff;
      --muted: #9db3cf;
      --good: #2ed5a7;
      --bad: #ff6b6b;
      --warn: #ffca57;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, var(--bg-b), var(--bg-a) 60%);
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title { margin: 0; font-size: clamp(1.3rem, 2.5vw, 2rem); }
    .stamp { color: var(--muted); font-size: .95rem; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .card {
      background: rgba(16, 27, 43, .92);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .label { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
    .value { margin-top: 6px; font-size: 1.1rem; font-weight: 700; word-break: break-word; }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .error { margin-top: 8px; color: var(--bad); white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1 class="title">NKP Demo Wall</h1>
      <div class="stamp">Auto-refresh: 5s | Last update: <span id="updatedAt">-</span></div>
    </div>

    <section class="cards">
      <article class="card">
        <div class="label">CD Engine</div>
        <div id="engine" class="value">-</div>
      </article>
      <article class="card">
        <div class="label">Scenario Branch</div>
        <div id="branch" class="value">-</div>
      </article>
      <article class="card">
        <div class="label">Revision</div>
        <div id="revision" class="value">-</div>
      </article>
      <article class="card">
        <div class="label">Sync / Health</div>
        <div id="syncHealth" class="value">-</div>
      </article>
      <article class="card">
        <div class="label">Loadgen (Desired/Ready)</div>
        <div id="loadgen" class="value">-</div>
      </article>
      <article class="card">
        <div class="label">Canary Weights (v1/v2)</div>
        <div id="canaryWeights" class="value">-</div>
      </article>
      <article class="card">
        <div class="label">Policy Compliance</div>
        <div id="policy" class="value">-</div>
      </article>
    </section>

    <section class="kpi-grid" id="kpiCards"></section>

    <article class="card">
      <div class="label">Status</div>
      <div id="error" class="error"></div>
    </article>
  </div>

  <script>
    function klassByStatus(s) {
      if (s === "good" || s === "Healthy" || s === "Synced") return "good";
      if (s === "bad" || s === "Degraded" || s === "Missing") return "bad";
      return "warn";
    }

    function safe(v) {
      return (v === undefined || v === null || v === "") ? "-" : String(v);
    }

    function setText(id, value, klass) {
      const el = document.getElementById(id);
      el.textContent = safe(value);
      el.className = "value " + (klass || "");
    }

    function render(data) {
      document.getElementById("updatedAt").textContent = new Date(data.now).toLocaleTimeString();
      const cd = data.cd || {};
      setText("engine", cd.engine, "");
      setText("branch", cd.branch, "");
      setText("revision", cd.revision, "");

      const sh = `${safe(cd.sync)} / ${safe(cd.health)}`;
      setText("syncHealth", sh, klassByStatus(cd.health));

      const lg = data.loadgen || {};
      setText("loadgen", `${safe(lg.desiredReplicas)}/${safe(lg.readyReplicas)} (${safe(lg.profile)})`, "");

      const canary = data.canary || {};
      setText("canaryWeights", `${safe(canary.v1)}/${safe(canary.v2)}`, "");

      const policy = data.policy || {};
      setText("policy", `${safe(policy.compliance)}% (${safe(policy.status)})`, klassByStatus(policy.status));

      const kpiCards = document.getElementById("kpiCards");
      kpiCards.innerHTML = "";
      (data.kpi || []).forEach(k => {
        const card = document.createElement("article");
        card.className = "card";
        const statusClass = klassByStatus(k.status);
        card.innerHTML = `
          <div class="label">${safe(k.name)}</div>
          <div class="value ${statusClass}">${safe(k.value)}</div>
          <div class="label">Target: ${safe(k.threshold)}</div>
        `;
        kpiCards.appendChild(card);
      });

      document.getElementById("error").textContent = "";
    }

    async function tick() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error(`status ${res.status}`);
        render(await res.json());
      } catch (err) {
        document.getElementById("error").textContent = "Status fetch failed: " + err;
      }
    }

    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
