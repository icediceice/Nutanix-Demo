apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog-api
  namespace: demo-app
spec:
  hosts:
    - catalog-api.demo-app.svc.cluster.local
  http:
    - name: from-frontend-v2
      match:
        - sourceLabels:
            app: frontend
            version: v2
      route:
        - destination:
            host: catalog-api.demo-app.svc.cluster.local
            subset: v2
          weight: 100
    - name: from-frontend-v1
      match:
        - sourceLabels:
            app: frontend
            version: v1
      route:
        - destination:
            host: catalog-api.demo-app.svc.cluster.local
            subset: v1
          weight: 100
    - name: default
      route:
        - destination:
            host: catalog-api.demo-app.svc.cluster.local
            subset: v1
          weight: 100
        - destination:
            host: catalog-api.demo-app.svc.cluster.local
            subset: v2
          weight: 0
