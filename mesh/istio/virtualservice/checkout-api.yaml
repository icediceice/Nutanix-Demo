apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: checkout-api
  namespace: demo-app
spec:
  hosts:
    - checkout-api.demo-app.svc.cluster.local
  http:
    - route:
        - destination:
            host: checkout-api.demo-app.svc.cluster.local
            subset: v1
          weight: 100
        - destination:
            host: checkout-api.demo-app.svc.cluster.local
            subset: v2
          weight: 0

