apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: istio-helm-gateway-ns
spec:
  selector:
    # Standard Istio label used by ingressgateway pods across many installs (including NKP Istio Helm).
    # If your cluster differs, adjust to match the ingressgateway workload labels.
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
