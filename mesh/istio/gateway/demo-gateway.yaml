apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: istio-helm-gateway-ns
spec:
  selector:
    # NKP "istio-helm" ingressgateway typically labels its pods with:
    #   istio=istio-helm-ingressgateway
    # If your cluster differs, adjust to match the ingressgateway workload labels.
    istio: istio-helm-ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
